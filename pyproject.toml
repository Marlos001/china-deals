[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "china-deals"
version = "0.9.0"
description = "Read-only marketplace research and Fansbuy-to-Brazil cost estimates for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Marlos" }]
keywords = ["cli", "agents", "taobao", "tmall", "1688", "weidian", "goofish", "jd", "blibli", "alibaba", "aliexpress", "fansbuy", "brazil"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Topic :: Internet"]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]

[project.scripts]
china-deals = "china_deals.cli:main"

[project.urls]
Repository = "https://github.com/Marlos001/china-deals"
Issues = "https://github.com/Marlos001/china-deals/issues"

[tool.hatch.build.targets.wheel]
packages = ["china_deals"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
