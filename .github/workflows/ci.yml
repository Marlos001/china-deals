name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.14.14'
      # Existing unused import, outside the release tooling ownership boundary.
      - run: ruff check china_deals tests scripts --per-file-ignores tests/test_marketplaces.py:F401
  installed-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build==1.3.0'
      - run: python scripts/release_artifacts.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/artifacts"
      - name: Prepare test bundle without application source
        run: |
          mkdir "$RUNNER_TEMP/bundle"
          cp -a tests scripts examples pyproject.toml "$RUNNER_TEMP/bundle/"
      - name: Prepare offline test image
        run: |
          printf 'FROM python:%s-slim\nRUN pip install "hatchling>=1.26,<2"\n' '${{ matrix.python }}' > "$RUNNER_TEMP/Dockerfile"
          docker build -t china-deals-ci -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
      - name: Install and test both artifacts with networking disabled
        run: |
          set -euo pipefail
          for artifact in "$RUNNER_TEMP"/artifacts/*.whl "$RUNNER_TEMP"/artifacts/*.tar.gz; do
            name=$(basename "$artifact")
            docker run --rm --network none \
              -v "$RUNNER_TEMP/artifacts:/artifacts:ro" -v "$RUNNER_TEMP/bundle:/bundle:ro" \
              china-deals-ci sh -ec 'python /bundle/scripts/check_offline_container.py; pip install --no-index --no-build-isolation "/artifacts/$1"; cd /tmp; python /bundle/scripts/verify_installed.py /bundle; china-deals schema >/dev/null' sh "$name" \
              2>&1 | tee "$RUNNER_TEMP/artifacts/$name.install-test.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-python-${{ matrix.python }}
          path: ${{ runner.temp }}/artifacts/
